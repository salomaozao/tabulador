<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Entrar — Tabulador de Respostas</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%232a78d6'/%3E%3Cpath d='M4 5h8M4 8h6M4 11h4' stroke='white' stroke-width='1.6'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/static/app.css">
<style>
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    background: var(--surface-2);
    padding: 20px;
  }
  .login-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 36px 32px;
    width: 100%;
    max-width: 420px;
    box-shadow: 0 4px 24px rgba(0,0,0,.06);
    text-align: center;
  }
  .login-logo {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 48px;
    height: 48px;
    border-radius: 10px;
    background: var(--accent);
    color: #fff;
    margin-bottom: 16px;
  }
  .login-card h1 {
    font-size: 20px;
    margin: 0 0 8px;
  }
  .login-card p {
    font-size: 13px;
    color: var(--text-2);
    margin: 0 0 24px;
    line-height: 1.5;
  }
  .btn-ms {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    width: 100%;
    padding: 10px 16px;
    font-size: 14px;
    font-weight: 500;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    cursor: pointer;
    text-decoration: none;
    transition: background .15s, border-color .15s;
  }
  .btn-ms:hover {
    background: var(--surface-3);
    border-color: var(--text-3);
  }
  .aviso-erro {
    background: var(--warn-bg);
    color: var(--danger);
    border: 1px solid var(--danger);
    padding: 10px 14px;
    border-radius: 8px;
    font-size: 13px;
    margin-bottom: 20px;
    text-align: left;
  }
  .login-foot {
    margin-top: 24px;
    font-size: 11px;
    color: var(--text-3);
  }
</style>
</head>
<body>
<div class="login-card">
  <div class="login-logo">
    <svg viewBox="0 0 16 16" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4 5h8M4 8h6M4 11h4"/>
    </svg>
  </div>
  <h1>Tabulador de Respostas</h1>
  <p>Acesso restrito para a equipe do <b>Instituto Olhar / Jumppi</b>. Conecte-se com sua conta corporativa.</p>

  {% if erro %}
  <div class="aviso-erro">
    <b>⚠️ Não foi possível entrar</b>
    <div style="margin-top:4px">{{ erro }}</div>
  </div>
  {% endif %}

  <a href="{{ login_url }}" class="btn-ms">
    <!-- Ícone Microsoft Oficial -->
    <svg width="18" height="18" viewBox="0 0 23 23">
      <path fill="#f35325" d="M1 1h10v10H1z"/>
      <path fill="#81bc06" d="M12 1h10v10H12z"/>
      <path fill="#05a6f0" d="M1 12h10v10H1z"/>
      <path fill="#ffba08" d="M12 12h10v10H12z"/>
    </svg>
    <span>Entrar com Microsoft (Jumppi)</span>
  </a>

  <div class="login-foot">
    Ambiente seguro · Autenticação via Microsoft Entra ID
  </div>
</div>
</body>
</html>
